name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Rust estable
        run: rustup update stable && rustup default stable
      - name: Dependencias de Linux
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwayland-dev libxdo-dev libxcb-shape0-dev libxcb-xfixes0-dev libxkbcommon-dev
      - run: cargo fmt --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo test --locked

  native:
    name: Compilar en ${{ matrix.name }}
    strategy:
      matrix:
        include:
          - os: macos-15
            name: macOS ARM64
          - os: windows-2022
            name: Windows x86_64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Rust estable
        run: rustup update stable && rustup default stable
      - run: cargo check --locked
